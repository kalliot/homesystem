<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content=""width=device-width, initial-scale="1.0" />
    <title>Rotator control</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round|Material+Icons+Sharp|Material+Icons+Two+Tone" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />


    <script src="jquery.min.js" type="text/javascript"></script>
    <script src="mqttws31.js" type="text/javascript"></script>
    <script src="config.js" type="text/javascript"></script>

    <style>
        .turnbutton { -webkit-user-select: none;
                user-select: none;
                height:50px;
                width:100px;
             }
        .bigfont { font-size: xxx-large}
        .rouge {background-color: rgb(59, 2, 2); color:rgb(253, 178, 178); font-weight:bold}
        .blanc {background-color: rgb(43, 43, 43); color: rgb(253, 253, 253)}
        .hilited:hover {background-color: rgb(59, 2, 2); color:rgb(253, 178, 178); font-weight:bold}
        body {
          width: 100%;
          height: 100vh;
          margin: 0;
          padding: 0;
          background: rgb(0, 0, 0);
        }
        .center {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider {
            width: 300px;
            height:300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }
        .knob {
            width: 220px;
            height: 220px;
            background: black;
            border-radius:50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .knob .rotator {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 50%;
            box-shadow: 3px 3px 3px rgba(0,0,0,0.2), 
                        inset 1px 2px 1px black, 
                        2px -1px 1px rgba(0,0,0.0.2),
                        -1px -0px 1px rgba(0,0,0.0.2);
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .knob .text {
            width: 40px;
            height: 40px;
            margin: 0 50px;
            font-family: poppins;
            font-size: 16px;
            font-weight: 600;
            color: gray;
            border: 0.3mm solid gray;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pointer {
            position: absolute;
            width: 20px;
            top: calc(50% - 10px);
            left: 0;
            color: gray;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transform-origin: 110px 10px;
            transform: rotate(-45deg);
        }
        .pointer span {
            font-size: 60px;
            transform: rotate(165deg);
        }
        .pointer2 {
            position: absolute;
            width: 20px;
            top: calc(50% - 10px);
            left: 0;
            color: darkred;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transform-origin: 110px 10px;
            transform: rotate(-45deg);
        }
        .pointer2 span {
            font-size: 60px;
            transform: rotate(165deg);
        }


        circle {
            fill: none;
        }
    </style>

<script>




function setvalue(val)
{
    let pointer = document.querySelector(".pointer");
    let rotationAngle = (val + 151) % 360;
    pointer.style.transform = `rotate(${rotationAngle - 45}deg)`;
    text.innerHTML = val;
}

function requested_azim(val)
{
    let pointer = document.querySelector(".pointer2");
    let rotationAngle = (val + 151) % 360;
    pointer.style.transform = `rotate(${rotationAngle - 45}deg)`;
    text.innerHTML = val;
}

function turnCW()
{
    myDevice = "5be9c0";
    content = '{"dev":"' + myDevice +'", "id": "turn"' +
                ',"direction":"cw"}';
    console.log(content);
    mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
}


function turnCCW()
{
    myDevice = "5be9c0";
    content = '{"dev":"' + myDevice +'", "id": "turn"' +
                ',"direction":"ccw"}';
    console.log(content);
    mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
}

function stopTurn()
{
    myDevice = "5be9c0";
    content = '{"dev":"' + myDevice +'", "id": "turn"' +
                ',"direction":"still"}';
    console.log(content);
    mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
}

function startTurning()
{
    myDevice = "5be9c0";
    content = '{"dev":"' + myDevice +'", "id": "newtarget"' +
            ',"degr":' + $('#targetazim').html() + '}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
}


</script>
  
    


  </head>
  <body>
    <div class="center">
        <div class="slider">
            <div class="knob">
                <div class="rotator">
                    <div class="text" id="targetazim">200</div>
                </div>
                <div class="pointer">
                    <span class="material-icons">
                        play_arrow
                    </span>
                </div>
                <div class="pointer2">
                    <span class="material-icons">
                        play_arrow
                    </span>
                </div>

            </div>
            <svg width="300" height="300">
                <circle cx="150" cy="150" r="240"></circle>
                <circle cx="150" cy="150" r="240" id="circle2"></circle>
            </svg>
        </div>
        <div><button class="turnbutton" id="ccwbut" onpointerdown=turnCCW() onpointerup=stopTurn()>CCW</button></div>
        <div><button class="turnbutton" id="cwbut" onpointerdown=turnCW() onpointerup=stopTurn()>CW</button></div>
    </div>
    

    <script>
        let knob = document.querySelector(".knob");
        let circle = document.getElementById("circle2");
        let pointer = document.querySelector(".pointer");
        let pointer2 = document.querySelector(".pointer2");
        let text = document.querySelector(".text");
        var reconnectTimeout = 10000;
        let isRotating = false;

        document.addEventListener("mousedown", (e) => {
            if (e.target.closest(".knob")) {
                isRotating = true;
            }
        });


        const rotateKnob = (e) => {
            if (isRotating) {
                let knobX = knob.getBoundingClientRect().left + knob.clientWidth / 2;
                let knobY = knob.getBoundingClientRect().top + knob.clientHeight / 2;
                console.log(knobX, knobY);

                let deltaX = e.clientX - knobX;
                let deltaY = e.clientY - knobY;

                let angleRad = Math.atan2(deltaY, deltaX);
                let angleDeg = (angleRad * 180) / Math.PI;
                let rotationAngle = (angleDeg - 135 + 360) % 360;
                let textAngle = (angleDeg + 360 + 75) % 360;

                pointer2.style.transform = `rotate(${rotationAngle - 45}deg)`;
                let progressPercent = rotationAngle / 100 ;
                let textAzimuth     = textAngle / 100;

                circle.style.strokeDashoffset = `${880 - 660 * progressPercent}`;

                text.innerHTML = `${Math.round(textAzimuth * 100)}`;
            }
        };

        document.addEventListener("mousemove", rotateKnob);
        document.addEventListener("onpointerdown", rotateKnob);

        document.addEventListener("mouseup", () => {
                isRotating = false;
                startTurning();
             });
        document.addEventListener("onpointerup", () => {
                isRotating = false;
                startTurning();
            });


        function MQTTconnect() {
            mqtt = new Paho.MQTT.Client(
                            host,
                            port,
                            "web_" + parseInt(Math.random() * 100,
                            10));
            var options = {
                timeout: 3,
                useSSL: useTLS,
                cleanSession: false,
                onSuccess: onConnect,
                onFailure: function (message) 
                {
                    $('#status').val("Connection failed: " + message.errorMessage + "Retrying");
                    setTimeout(MQTTconnect, reconnectTimeout);
                }
            };

            mqtt.onConnectionLost = onConnectionLost;
            mqtt.onMessageArrived = onMessageArrived;

            if (username != null)
            {
                options.userName = username;
                options.password = password;
            }
            console.log("Host="+ host + ", port=" + port + " TLS = " + useTLS + " username=" + username + " password=" + password);
            mqtt.connect(options);
        }

        function onConnect() {
            // Connection succeeded; subscribe to our topic
            //console.log("connected, myDevice is ", myDevice);
            mqtt.subscribe("home/kallio/rotator/"+ myDevice + "/#", {qos: 0});
        }


        function onConnectionLost(response) {
            console.log("connection lost");
            setTimeout(MQTTconnect, reconnectTimeout);
        };

        function onMessageArrived(message) {

            var payload = message.payloadString;

            console.log(payload);
            const obj = JSON.parse(payload);

            if (obj.id == "movestate")
            {
                if (obj.state == "still")
                {
                    stateStill = true;
                    $('#cwbut').removeClass('rouge');
                    $('#ccwbut').removeClass('rouge');
                    pointer2.style.transform = pointer.style.transform;
                }
                if (obj.state == "cw")
                {
                    statiStill = false;
                    $('#cwbut').addClass('rouge');
                }
                if (obj.state == "ccw")
                {
                    statiStill = false;
                    $('#ccwbut').addClass('rouge');
                }
            }
            if (obj.id == "azimuth")
            {   
                console.log("got azimuth",obj.value);
                setvalue(obj.value);
            }
        }    

        $(document).ready(function() {
            myDevice = (new URL(location.href)).searchParams.get('dev');
            console.log(myDevice);
            MQTTconnect();
        });



    </script>
  </body>
</html>
