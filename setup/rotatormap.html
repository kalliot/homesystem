<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="jquery.min.js" type="text/javascript"></script>
	<script src="mqttws31.js" type="text/javascript"></script>
	<script src="config.js" type="text/javascript"></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}

			width: 99%;
			height: 35px;

			background-color:wheat;

		.leaflet-container {
			height: 100%;

<body>

<div class="box">
	<button id="butCCW" onpointerdown="turnCCW();" onpointerup="stopTurn();">CCW</button><br>
	<button id="butCW"  onpointerdown="turnCW();" onpointerup="stopTurn()">CW</button>
	<hr>
	<table id="nameTable"></table>
	<hr>
	<table>
		<tr><td class="angledisp" id="targetAngle">0</td></tr>
		<tr><td class="angledisp" id="beamAngle">0</td></tr>
	</table>
</div>
<div id='map' style='width: 100%; height: 100%;'></div>


<script>
	var targetPolygon;
	var rotatorPolygon;
	var currentAngle = 0;
	var currZoom = 19;
	var targetVisible = false;
	var myDevice = "5d11a8";
	var beamWidth = 10;
	var reconnectTimeout = 10000;
	var homeLat = 60.932521;
	var homeLng = 25.989413;

	function calculateAzimuth(lat1, lon1, lat2, lon2) {
		// Convert degrees to radians
		const φ1 = lat1 * Math.PI / 180;
		const φ2 = lat2 * Math.PI / 180;
		const Δλ = (lon2 - lon1) * Math.PI / 180;
		
		// Calculate components x and y
		const x = Math.sin(Δλ) * Math.cos(φ2);
		const y = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

		// Calculate initial bearing in radians
		const θ = Math.atan2(x, y);

		// Convert radians back to degrees and normalize to 0-360°
		const azimuth = (θ * 180 / Math.PI + 360) % 360;

		return azimuth;
	}


	function getDestinationPoint(lat, lon, bearing, distanceMeters) {
		const R = 6371e3; // Maapallon säde metreinä
		const φ1 = lat * Math.PI / 180;
		const λ1 = lon * Math.PI / 180;
		const θ = bearing * Math.PI / 180;
		const δ = distanceMeters / R;

		const sinφ1 = Math.sin(φ1);
		const cosφ1 = Math.cos(φ1);
		const sind = Math.sin(δ);
		const cosd = Math.cos(δ);

		const sinφ2 = sinφ1 * cosd + cosφ1 * sind * Math.cos(θ);
		const φ2 = Math.asin(sinφ2);

		const y = Math.sin(θ) * sind * cosφ1;
		const x = cosd - sinφ1 * sinφ2;
		const λ2 = λ1 + Math.atan2(y, x);

		return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
	}


	const map = L.map('map', {
		minZoom : 3,
		maxZoom : 19
	});
	map.setView([homeLat, homeLng], 19);


	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);


	const circle = L.circle([homeLat, homeLng], 
	{
		color: 'blue',
		fillColor: '#f03',
		fillOpacity: 0.1,
		radius: 3
	}).addTo(map).bindPopup('Home.');

	

	function zoom2beamLen(zoomLevel)
	{
		var meters = [];
		meters.push({ zoom: 19, m: 450});
		meters.push({ zoom: 18, m: 650});
		meters.push({ zoom: 17, m: 1500});
		meters.push({ zoom: 16, m: 2000});
		meters.push({ zoom: 15, m: 6000});
		meters.push({ zoom: 14, m: 8000});
		meters.push({ zoom: 13, m: 15000});
		meters.push({ zoom: 12, m: 30000});
		meters.push({ zoom: 11, m: 50000});
		meters.push({ zoom: 10, m: 100000});
		meters.push({ zoom:  9, m: 150000});
		meters.push({ zoom:  8, m: 200000});
		meters.push({ zoom:  7, m: 400000});
		meters.push({ zoom:  6, m: 800000});
		meters.push({ zoom:  5, m: 1500000});
		meters.push({ zoom:  4, m: 1800000});

		for (let i = 0; i < 16; i++)
		{
			if (meters[i].zoom == zoomLevel)
				return meters[i].m;
		}
		return 2000000;
	}

	

	function buildPolygon(length, angle)
	{
		const point1 = getDestinationPoint(homeLat, homeLng, angle - beamWidth / 2, length);
		const latlngs1 = [[homeLat, homeLng], point1];

		const point2 = getDestinationPoint(homeLat, homeLng, angle -1, length * 1.1);
		const latlngs2 = [[homeLat, homeLng], point2];

		const point3 = getDestinationPoint(homeLat, homeLng, angle +1, length * 1.1);
		const latlngs3 = [[homeLat, homeLng], point3];

		const point4 = getDestinationPoint(homeLat, homeLng, angle + beamWidth / 2, length);
		const latlngs4 = [[homeLat, homeLng], point4];

		return  [
			[homeLat, homeLng],
			point1,
			point2,
			point3,
			point4
		];
	}

	function createBeam(color, info) {
		length = zoom2beamLen(19);
		
		const point1 = getDestinationPoint(homeLat, homeLng, 360 - beamWidth / 2, length);
		const latlngs1 = [[homeLat, homeLng], point1];

		const point2 = getDestinationPoint(homeLat, homeLng, currentAngle, length * 1.1);
		const latlngs2 = [[homeLat, homeLng], point2];

		const point3 = getDestinationPoint(homeLat, homeLng,  beamWidth / 2, length);
		const latlngs3 = [[homeLat, homeLng], point3];
 		
		return L.polygon([
			[homeLat, homeLng],
			point1,
			point2,
			point3
		],{color: color}).addTo(map).bindPopup(info);
	}


	function hideTargetPolygon()
	{
		targetPolygon.setLatLngs(buildPolygon(2, currentAngle));
		targetVisible = false;
	}

	function onMapClick(e) {
		length = zoom2beamLen(currZoom);

		// now calculate azimuth from home to clicked point
		console.log("mouse pos is", e.latlng.lat, e.latlng.lng, "length id", length);
		currentAngle = calculateAzimuth(homeLat, homeLng, e.latlng.lat, e.latlng.lng);
		console.log("angle from home to mouseptr is ", currentAngle);

		$('#targetAngle').html(parseInt(currentAngle));
	
		targetPolygon.setLatLngs(buildPolygon(length, currentAngle));
		targetVisible = true;
		startTurning(currentAngle);
	}

	function onZoomed(zoomLevel) {
		currZoom = zoomLevel;

		// seuraavaksi riittää, että teen turnBeam ja 
		length = zoom2beamLen(zoomLevel);
		console.log("length = ", length);
		if (targetVisible) targetPolygon.setLatLngs(buildPolygon(length, currentAngle));
		rotatorPolygon.setLatLngs(buildPolygon(length, parseInt($('#beamAngle').html())));
	}

	function turnBeam(angle) {
		length = length = zoom2beamLen(currZoom);

		console.log("beamlength is ", length);
		$('#beamAngle').html(parseInt(angle));
		rotatorPolygon.setLatLngs(buildPolygon(length, angle));
	}

	function turnCW()
    {
        currAzim = Number($('#targetazim').html());
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                    ',"direction":"cw"}';
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function turnCCW()
    {
        currAzim = Number($('#targetazim').html());
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                    ',"direction":"ccw"}';
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function stopTurn()
    {
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                    ',"direction":"still"}';
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

	function startTurning(azim)
    {
        currAzim = parseInt($('#beamAngle').html());
        if (azim != currAzim)
        {
            content = '{"dev":"' + myDevice +'", "id": "newtarget"' +
                    ',"degr":' + azim + '}';
                mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
        }        
    }

	function turnNamed(name, azimuth)
    {
        content = '{"dev":"' + myDevice +'", "id": "namedtarget"' +
                  ',"name":"' + name + '"}';
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
		$('#targetAngle').html(azimuth);
		targetPolygon.setLatLngs(buildPolygon(zoom2beamLen(currZoom), azimuth));
		targetVisible = true;
    }


	map.on('click', onMapClick);
	map.on('zoomend', function (e) {
		onZoomed(e.target._zoom);
		console.log('zoomlevel is', e.target._zoom);
	});


	targetPolygon = createBeam('red', 'This is a target direction.');
	rotatorPolygon = createBeam('blue', 'Not turning, i am close to the beam.');

    function MQTTconnect() 
	{
        mqtt = new Paho.MQTT.Client(
                        host,
                        port,
                        "web_" + parseInt(Math.random() * 100,
                        10));
        var options = {
            timeout: 3,
            useSSL: useTLS,
            cleanSession: false,
            onSuccess: onConnect,
            onFailure: function (message) 
            {
                console.log("Connection failed: ", message.errorMessage, "Retrying");
                setTimeout(MQTTconnect, reconnectTimeout);
            }
        };
        mqtt.onConnectionLost = onConnectionLost;
        mqtt.onMessageArrived = onMessageArrived;

        if (username != null)
        {
            options.userName = username;
            options.password = password;
        }
        console.log("Host="+ host + ", port=" + port + " TLS = " + useTLS + " username=" + username + " password=" + password);
        mqtt.connect(options);
	}

	function onConnect() {
		console.log("mqtt connected");
		mqtt.subscribe("home/kallio/rotator/" + myDevice + "/setup/#", {qos: 0});
        mqtt.subscribe("home/kallio/rotator/"+ myDevice + "/#", {qos: 0});
		mqtt.subscribe("home/kallio/devices/" + myDevice, {qos: 0});
    }


    function onConnectionLost(response) {
        console.log("connection lost");
        setTimeout(MQTTconnect, reconnectTimeout);
    };

    function onMessageArrived(message) {

        var payload = message.payloadString;

        const obj = JSON.parse(payload);

		if (obj.id == "device" && obj.type=="rotator")
        {
            if (obj.connected == 1)
            {
                //$('#activestatus').html('rotator is active');
				console.log("rotator is active");
            }
            if (obj.connected == 0)
            {
                //$('#activestatus').html('device is not active');
				console.log("rotator is not running");
            }
        }
		if (obj.id == "settings")
		{
			beamWidth = parseInt(obj.beamwidth);
			console.log("beamwidth", beamWidth);
		}
        if (obj.id == "movestate")
        {
            if (obj.state == "still")
            {
                $('#butCW').removeClass('rouge');
                $('#butCCW').removeClass('rouge');
				if (obj.reason != "dirchange")
				{
					setTimeout(hideTargetPolygon, 1200);
				}	
            }
            if (obj.state == "cw")
            {
                $('#butCW').addClass('rouge');
            }
            if (obj.state == "ccw")
            {
                $('#butCCW').addClass('rouge');
            }
        }
        if (obj.id == "azimuth")
        {   
			turnBeam(obj.value);
		}
        if (obj.id == "nametable")
        {
            
            $('#nameTable tbody').empty(); // remove lines from names table, otherwise its appended every time.
            namearr = obj.names;
            for (rec of namearr)
            {
                addstr = '<tr><td><button onclick=turnNamed("' + rec.name + '",'+ rec.azimuth +')>' + rec.name + '</button></td></tr>';
				console.log(addstr);
                $('#nameTable').append(addstr);
            }
        }
    }    

	$(document).ready(function() {
        console.log(myDevice);
        MQTTconnect();
    });

</script>


</body>
