<html xmlns="http://www.w3.org/1999/xhtml">

    <style>
        .but { -webkit-user-select: none;
                user-select: none;}
        .bigfont { font-size: xxx-large}
        .rouge {background-color: rgb(59, 2, 2); color:rgb(253, 178, 178); font-weight:bold}
        .blanc {background-color: rgb(43, 43, 43); color: rgb(253, 253, 253)}
        .namebutton { width:70px; }
        .hilited:hover {background-color: rgb(59, 2, 2); color:rgb(253, 178, 178); font-weight:bold}
    </style>


  <head>
    <title>Rotator setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="mqttws31.js" type="text/javascript"></script>
    <script src="jquery.min.js" type="text/javascript"></script>
    
    <script src="config.js" type="text/javascript"></script>
    <link rel="stylesheet" href="setup.css" type="text/css">
    <script type="text/javascript">
    var mqtt;
    var reconnectTimeout = 10000;
    var myDevice = "none";
    var stateStill = true;


    function MQTTconnect() {
        mqtt = new Paho.MQTT.Client(
                        host,
                        port,
                        "web_" + parseInt(Math.random() * 100,
                        10));
        var options = {
            timeout: 3,
            useSSL: useTLS,
            cleanSession: false,
            onSuccess: onConnect,
            onFailure: function (message) 
            {
                $('#status').val("Connection failed: " + message.errorMessage + "Retrying");
                setTimeout(MQTTconnect, reconnectTimeout);
            }
        };

        mqtt.onConnectionLost = onConnectionLost;
        mqtt.onMessageArrived = onMessageArrived;

        if (username != null)
         {
            options.userName = username;
            options.password = password;
        }
        console.log("Host="+ host + ", port=" + port + " TLS = " + useTLS + " username=" + username + " password=" + password);
        mqtt.connect(options);
    }


    function editName(name, azimuth)
    {
        $('#editname').val(name);
        $('#editazim').val(azimuth);
    }

    function sendCoord()
    {
        name = $('#editname').val();
        azimuth = $('#editazim').val();
        console.log('updating',name, azimuth);
        content = '{"dev":"' + myDevice +'", "id": "updatenames"' +
                  ',"name":"' + name + '","azimuth":' + azimuth + '}';
        console.log(content);        
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function delCoord()
    {
        name = $('#editname').val();
        console.log('Deleting',name);
        content = '{"dev":"' + myDevice +'", "id": "delname"' +
                  ',"name":"' + name + '"}';
        console.log(content);        
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function turnNamed(name)
    {
        console.log(name);
        content = '{"dev":"' + myDevice +'", "id": "namedtarget"' +
                  ',"name":"' + name + '"}';
        console.log(content);        
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function turnCW()
    {
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                  ',"direction":"cw"}';
        console.log(content);        
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function calMax()
    {
        content = '{"dev":"' + myDevice +'", "id": "calmax"}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function calMin()
    {
        content = '{"dev":"' + myDevice +'", "id": "calmin"}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function saveCal()
    {
        content = '{"dev":"' + myDevice +'", "id": "savecalibr"}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function turnCCW()
    {
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                  ',"direction":"ccw"}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function stopTurn()
    {
        content = '{"dev":"' + myDevice +'", "id": "turn"' +
                  ',"direction":"still"}';
        console.log(content);        
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function sendDirection()
    {
        stateStill = false;
        content = '{"dev":"' + myDevice +'", "id": "newtarget"' +
                  ',"degr":' + $('#direction').val() + '}';
        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
    }

    function connectSlider(src, dst)
    {
        console.log(src, "changed to", $(src).val());
        $(dst).val($(src).val());
    }

    function sendsetup()
    {
        content = '{"dev":"' + myDevice +
                  '","id":"setsettings"' +
                  ',"hardstop":' + $('#hardstop').val() +
                  ',"inertiams":' + $('#inertiams').val() +
                  ',"inertiadegr":' + $('#inertiadegr').val() +
                  ',"turnspeed":' + $('#turnspeed').val() +
                  ',"beamwidth":' + $('#beamwidth').val()+ '}';

        console.log(content);
        mqtt.send("home/kallio/rotator/" + myDevice + "/set", content, 0 , false);
        return false;
    }


    function onConnect() {
        // Connection succeeded; subscribe to our topic
        console.log("connected, myDevice is ", myDevice);
        mqtt.subscribe("home/kallio/rotator/" + myDevice + "/setup/#", {qos: 0});
        mqtt.subscribe("home/kallio/rotator/" + myDevice + "/#", {qos: 0});
        mqtt.subscribe("home/kallio/devices/" + myDevice, {qos: 0});
    }


    function onConnectionLost(response) {
        console.log("connection lost");
        setTimeout(MQTTconnect, reconnectTimeout);
    };


    function timeredFunc(id, temperature)
    {
        $(id).html(temperature);
    }


    function onMessageArrived(message) {

        var payload = message.payloadString;
    
        console.log(payload);
        const obj = JSON.parse(payload);
        if (obj.dev != myDevice) return;

        console.log(obj.id);
        if (obj.id == "device" && obj.type=="rotator")
        {
            if (obj.connected == 1)
            {
                $('#activestatus').html('rotator is active');
            }
            if (obj.connected == 0)
            {
                $('#activestatus').html('device is not active');
            }

        }
        if (obj.id == "settings")
        {
            $('#hardstop').val(obj.hardstop);
            $('#inertiams').val(obj.inertiams);
            $('#inertiadegr').val(obj.inertiadegr);
            $('#beamwidth').val(obj.beamwidth);
            $('#turnspeed').val(obj.turnspeed);
        }
        if (obj.id == "movestate") 
        {
            if (obj.state == "still")
            {
                console.log("removing button classes");
                stateStill = true;
                $('#cwbut').removeClass();
                $('#ccwbut').removeClass();
                $('#direction').val($(currazimuth).html());
                connectSlider('#direction','#directionRange');
            }
            if (obj.state == "cw")
            {
                statiStill = false;
                $('#cwbut').removeClass().addClass('rouge');
                console.log("turning cw");
            }
            if (obj.state == "ccw")
            {
                statiStill = false;
                $('#ccwbut').removeClass().addClass('rouge');
                console.log("turning ccw");
            }
        }
        if (obj.id == "azimuth")
        {   
            console.log("got azimuth",obj.value);
            $('#currazimuth').html(obj.value);
            $('#currname').html(obj.name);
            if (stateStill)
            {
                $('#direction').val($(currazimuth).html());
                connectSlider('#direction','#directionRange');
            }
        }
        if (obj.id == "nametable")
        {
            console.log("got nametable");
            $('#nametable tbody').empty(); // remove lines from names table, otherwise its appended every time.
            namearr = obj.names;
            for (rec of namearr)
            {
                addstr = '<tr class="hilited"><td width="90" align="center"><button class ="namebutton" onclick=turnNamed("' + rec.name + '")>' + rec.name + '</button><td onclick=editName("'+rec.name+'",this.innerHTML)>' + rec.azimuth + '<td></tr>';
                $('#nametable').append(addstr);
            }
        }
    };


    $(document).ready(function() {
        myDevice = (new URL(location.href)).searchParams.get('dev');
        console.log(myDevice);
        MQTTconnect();
    });

    </script>



  </head>
  <body style="background-color:rgb(35, 39, 39); color:white;">
    <h1>Rotator setup</h1>
    <div>
        <td>
            <table>
                <tr><td><button onclick=calMin()>Cal min</button></td>
                    <td><button onclick=calMax()>Cal max</button></td>
                    <td><button onclick=saveCal()>Save calibrations</button></td></tr>
                    <tr><td id="activestatus" colspan="3">device is not active</td></tr>
            </table>
        </td>
        <table><tr><td>
        <form> 
            <input type="hidden" id="id" value="setup"><br>
            <table>
            <tr><td><label for="hardstop">Hard stop</label></td>
                <td><input type="text" 
                            id="hardstop" 
                            size=5/>
                </td>

            <tr><td><label for="inertiams">Inertia ms</label></td>
                <td><input type="text" 
                            id="inertiams" 
                            size=5/>
            </td>

            <tr><td><label for="inertiadegr">Inertia degrees</label></td>
                <td><input type="text" 
                            id="inertiadegr" 
                            size=5/>
            </td>

            <tr><td><label for="beamwidth">Beam width</label></td>
                <td><input type="text" 
                            id="beamwidth" 
                            size=5/>
            </td>
            </tr>    

            <tr><td><label for="turnspeed">Turn speed degr / 10 sec</label></td>
                <td><input type="text"
                            id="turnspeed"
                            size=5/>
            </td>
            </tr>
            <tr><td><button type="button" onClick="sendsetup()">Update</button></td></tr>
            </table>
        </form>
        <table id="nametable">
        <tr><thead><th>name</th><th>azimuth</th></thead></tr>
        </table>
        </form>

        <table>
            <tr><td><input type="text" size=10 id="editname"></td>
                <td><input type="text" size=5 id="editazim"></td>
                <td><button type="button" onClick="sendCoord()">Update/Insert</button></td>
                <td><button type="button" onClick="delCoord()">Delete</button></td></tr>
            </table>
        </td>
        </form>

        <td>
            <table>
                <tr><td>Azimuth</td><td class="bigfont" id="currazimuth"></td></tr>
                <tr><td>Name</td><td class="bigfont" id="currname"></td></tr>
                
            </table>
        </td>

        </tr>
        <td>
            <table>
                <tr><td><button class="but" id="ccwbut" onpointerdown=turnCCW() onpointerup=stopTurn()>CCW</button></td>
                    <td><button class="but" id="cwbut" onpointerdown=turnCW()  onpointerup=stopTurn()>CW</button></td></tr>
                    <tr><td><label for="direction">Set direction</label></td>
                        <td><input type ="text" id="direction" size=4 readonly/></td>
                        <td><input type="range"
                                   min=0
                                   max=360
                                   step=1
                                   id="directionRange"
                                   oninput="connectSlider('#directionRange','#direction')" onchange="sendDirection()">
                        </td>
                    </tr>
            </table>
        </td>
    </table>
    </div>
  </body>
</html>
